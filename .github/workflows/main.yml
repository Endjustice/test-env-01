name: On-Demand AI Judge
on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-judge]

concurrency:
  group: ai-node
  cancel-in-progress: true

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Deployment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          chmod +x ./setup.sh
          ./setup.sh
