name: Core Health Check
on:
  workflow_dispatch:
jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: System Deployment
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          chmod +x ./setup.sh
          ./setup.sh $CF_TOKEN
